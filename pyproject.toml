[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "riskmetrics"
version = "1.0.0"
description = "Performance and risk statistics with bootstrap intervals and multiple-testing corrections (deflated Sharpe, Holm). Pure Python, no dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TPOALOS"}]
keywords = ["sharpe-ratio", "deflated-sharpe", "backtesting", "risk", "drawdown", "bootstrap", "multiple-testing", "quant"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Homepage = "https://github.com/TPOALOS/riskmetrics"
Issues = "https://github.com/TPOALOS/riskmetrics/issues"

[project.scripts]
riskmetrics = "riskmetrics.cli:main"

[tool.setuptools]
packages = ["riskmetrics"]
